# Baut die App als statische Seite und veroeffentlicht sie auf GitHub Pages.
#
# Wichtig fuer den Klavier-Modus: Pages liefert HTTPS aus, und nur dort gibt
# der Browser die Web MIDI API frei.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment nach dem anderen; laufende Builds werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run lint

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build
        # Bei einem Projekt-Repo liegt die App unter /<repo-name>/ — der
        # Basispfad kommt deshalb aus der Pages-Konfiguration.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
